version: 1
formatters:
  simple:
    format: '%(asctime)s - %(levelname)-8s - %(message)s'
    datefmt: "%d/%m/%Y %H:%M:%S"
handlers:
  back_file:
    class: logging.FileHandler
    formatter: simple
    filename: logs/backend.log
    mode : w
    encoding: utf8
loggers:
  backLogger:
    handlers: [back_file]
    propagate: no
root:
  level: INFO
  handlers: [back_file]