apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: conteneur_frontend # mettre le nom de l'image du backend pour l'api
          imagePullPolicy: Always
          resources:
            limits:
              memory: "200Mi"
              cpu: "300m"
          envFrom:
            - configMapRef:
                name: configuration-backend # meme nom que dans le configmap
          ports:
            - containerPort: 8000